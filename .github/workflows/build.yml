name: Build

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run mapping tests
        run: swift test
      - name: Build universal macOS app
        run: ./scripts/package-release.sh
      - name: Upload app archive
        uses: actions/upload-artifact@v4
        with:
          name: CaseCloser-macOS
          path: dist/CaseCloser-*-macOS.zip
